<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Solo Missions</title>
  <style>
    /* ── Tokens ── */
    :root {
      --canvas:         #080808;
      --surface:        #111111;
      --elevated:       #1a1a1a;
      --border-subtle:  #222222;
      --border-default: #333333;
      --fg:             #f5f5f4;
      --fg-body:        #e7e5e4;
      --fg-muted:       #6b7280;
      --accent:         #38bdf8;
      --accent-tint:    rgba(56,189,248,0.12);
      --accent-ring:    rgba(56,189,248,0.30);
      --danger:         #f43f5e;
      --danger-tint:    rgba(244,63,94,0.12);
      --success:        #34d399;
      --radius:         14px;
      --radius-sm:      8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-tap-highlight-color: transparent; }

    body {
      background:
        radial-gradient(ellipse 90% 40% at 50% 0%, #0d2035 0%, transparent 70%),
        #080808;
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100svh;
      font-size: 16px;
      line-height: 1.5;
    }

    /* ── Typography ── */
    .display {
      font-size: clamp(1.9rem, 7vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.045em;
      line-height: 1.05;
    }
    .eyebrow {
      font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--fg-muted);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 600; border-radius: var(--radius-sm); cursor: pointer;
      transition: background 100ms, box-shadow 100ms, transform 80ms, opacity 100ms;
      outline: none; border: 1px solid transparent; white-space: nowrap;
      font-family: inherit; touch-action: manipulation; -webkit-appearance: none;
    }
    .btn:focus-visible { box-shadow: 0 0 0 2px var(--canvas), 0 0 0 4px var(--accent); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
    .btn:active:not(:disabled) { transform: scale(0.97); }

    .btn-sm  { min-height: 36px; padding: 0 14px; font-size: 13px; }
    .btn-md  { min-height: 44px; padding: 0 22px; font-size: 15px; }
    .btn-lg  { min-height: 52px; padding: 0 28px; font-size: 16px; }

    .btn-primary {
      background: var(--accent); color: #080808; border-color: transparent;
    }
    .btn-primary:hover { background: #7dd3fc; }
    .btn-primary:active { background: #0ea5e9; }

    .btn-ghost {
      background: transparent; color: var(--fg-muted); border-color: var(--border-subtle);
    }
    .btn-ghost:hover { background: var(--elevated); color: var(--fg); border-color: var(--border-default); }

    .btn-danger {
      background: var(--danger-tint); color: var(--danger); border-color: rgba(244,63,94,0.3);
    }
    .btn-danger:hover { background: rgba(244,63,94,0.2); }

    /* ── Input ── */
    .input {
      width: 100%; min-height: 52px; padding: 0 16px;
      background: var(--elevated); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm); font-size: 17px; color: var(--fg); outline: none;
      font-family: inherit; transition: border-color 120ms, box-shadow 120ms;
      -webkit-appearance: none; appearance: none;
    }
    .input::placeholder { color: var(--fg-muted); opacity: 0.6; }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
    }

    /* ── Screens ── */
    .screen { display: none; }
    .screen.active { display: flex; }

    /* ══════════════════ ONBOARDING ══════════════════ */
    #screen-onboard {
      min-height: 100svh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .onboard-box {
      width: 100%; max-width: 400px;
      display: flex; flex-direction: column; gap: 28px;
    }
    .onboard-header { display: flex; flex-direction: column; gap: 10px; }
    .onboard-header .eyebrow { color: var(--accent); }
    .onboard-header .sub { font-size: 15px; color: var(--fg-muted); line-height: 1.6; }
    .onboard-row { display: flex; flex-direction: column; gap: 10px; }

    /* ══════════════════ DASHBOARD ══════════════════ */
    #screen-dashboard { flex-direction: column; min-height: 100svh; }

    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-subtle);
      position: sticky; top: 0;
      background: rgba(8,8,8,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 10;
    }
    .nav-brand .eyebrow { color: var(--accent); margin-bottom: 2px; }
    .nav-name { font-size: 15px; font-weight: 700; color: var(--fg); }
    .stat-pill {
      font-size: 13px; font-weight: 600;
      color: var(--fg-muted);
      background: var(--elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 999px; padding: 6px 14px;
    }
    .stat-pill em { color: var(--accent); font-style: normal; }

    .dashboard-hero {
      padding: 36px 20px 24px;
      max-width: 600px; margin: 0 auto; width: 100%;
    }
    .dashboard-hero .display { margin-bottom: 10px; }
    .dashboard-hero p { font-size: 15px; color: var(--fg-muted); }

    .missions-list {
      padding: 0 20px 80px;
      max-width: 600px; margin: 0 auto; width: 100%;
      display: flex; flex-direction: column; gap: 10px;
    }

    .mission-card {
      cursor: pointer; padding: 18px;
      display: flex; align-items: center; gap: 16px;
      transition: border-color 150ms, background 150ms;
      -webkit-tap-highlight-color: transparent;
    }
    .mission-card:active { background: var(--elevated); }
    .mission-card.done { border-color: rgba(56,189,248,0.3); background: rgba(56,189,248,0.04); }
    .mission-card.gap  { border-color: rgba(244,63,94,0.3);  background: rgba(244,63,94,0.04); }

    .m-icon {
      font-size: 26px;
      width: 50px; height: 50px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--elevated); border: 1px solid var(--border-subtle); border-radius: 12px;
    }
    .mission-card.done .m-icon { border-color: rgba(56,189,248,0.3); background: var(--accent-tint); }
    .mission-card.gap  .m-icon { border-color: rgba(244,63,94,0.3);  background: var(--danger-tint); }

    .m-body { flex: 1; min-width: 0; }
    .m-title { font-size: 15px; font-weight: 700; color: var(--fg); margin-bottom: 2px; }
    .m-sub   { font-size: 13px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mission-card.done .m-title { color: var(--accent); }
    .mission-card.gap  .m-title { color: var(--danger); }

    .m-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .m-badge {
      font-size: 11px; font-weight: 700; font-family: ui-monospace, monospace;
      border-radius: 6px; padding: 3px 8px;
      background: var(--elevated); color: var(--fg-muted);
      border: 1px solid var(--border-subtle);
    }
    .mission-card.done .m-badge { color: var(--accent); border-color: rgba(56,189,248,0.3); background: var(--accent-tint); }
    .mission-card.gap  .m-badge { color: var(--danger);  border-color: rgba(244,63,94,0.3);  background: var(--danger-tint); }

    .m-bar { width: 56px; height: 4px; background: var(--border-subtle); border-radius: 2px; overflow: hidden; }
    .m-bar-fill { height: 100%; border-radius: 2px; transition: width 300ms ease; }
    .m-bar-fill.ok   { background: var(--accent); }
    .m-bar-fill.warn { background: var(--danger); }

    /* ══════════════════ DETAIL ══════════════════ */
    #screen-detail { flex-direction: column; min-height: 100svh; }

    .detail-nav {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(8,8,8,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: sticky; top: 0; z-index: 10;
    }
    .detail-nav-title { font-size: 15px; font-weight: 700; color: var(--fg); flex: 1; }

    .detail-body {
      max-width: 560px; margin: 0 auto; width: 100%;
      padding: 28px 20px 80px;
      display: flex; flex-direction: column; gap: 28px;
    }

    .detail-icon { font-size: 38px; margin-bottom: 4px; }
    .detail-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--fg); margin-bottom: 8px; }
    .detail-desc  { font-size: 15px; color: var(--fg-muted); line-height: 1.7; }

    /* Alert banners */
    .banner {
      border-radius: 12px; padding: 16px 18px;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .banner-icon { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
    .banner-text .title { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
    .banner-text .sub   { font-size: 13px; opacity: 0.8; }

    .banner-gap  { background: var(--danger-tint); border: 1px solid rgba(244,63,94,0.35); }
    .banner-gap  .title { color: var(--danger); }
    .banner-gap  .sub   { color: var(--fg-muted); }
    .banner-done { background: var(--accent-tint); border: 1px solid rgba(56,189,248,0.35); }
    .banner-done .title { color: var(--accent); }
    .banner-done .sub   { color: var(--fg-muted); }

    /* Section label */
    .section-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--fg-muted); margin-bottom: 14px;
    }

    /* Streak row */
    .streak-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .streak-box {
      padding: 14px 16px;
      background: var(--elevated); border: 1px solid var(--border-subtle); border-radius: 12px;
    }
    .streak-num { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; color: var(--accent); }
    .streak-lbl { font-size: 12px; color: var(--fg-muted); margin-top: 2px; }

    /* Day grid */
    .day-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    @media (max-width: 360px) { .day-grid { grid-template-columns: repeat(5, 1fr); } }

    .day-cell {
      aspect-ratio: 1;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      background: var(--elevated);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1px;
      position: relative;
      transition: border-color 120ms, background 120ms;
    }
    .day-cell.checked {
      background: var(--accent-tint);
      border-color: rgba(56,189,248,0.45);
    }
    .day-cell.today-unchecked {
      border-color: rgba(56,189,248,0.5);
      cursor: pointer;
      box-shadow: 0 0 0 2px rgba(56,189,248,0.15);
    }
    .day-cell.today-unchecked:active { transform: scale(0.94); }
    .day-cell.missed {
      background: var(--danger-tint);
      border-color: rgba(244,63,94,0.35);
    }
    .day-cell.future {
      opacity: 0.3;
    }
    .day-n    { font-size: 11px; font-weight: 700; color: var(--fg-muted); line-height: 1; }
    .day-cell.checked .day-n         { color: var(--accent); }
    .day-cell.today-unchecked .day-n { color: var(--accent); }
    .day-cell.missed .day-n          { color: var(--danger); }
    .day-tick { font-size: 10px; line-height: 1; }

    /* Oneshot */
    .oneshot-box {
      padding: 20px;
      background: var(--elevated); border: 1px solid var(--border-subtle); border-radius: 12px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .oneshot-box.done { background: var(--accent-tint); border-color: rgba(56,189,248,0.35); }
    .oneshot-box-label { font-size: 15px; font-weight: 700; color: var(--fg); }
    .oneshot-box.done .oneshot-box-label { color: var(--accent); }
    .oneshot-box-sub { font-size: 13px; color: var(--fg-muted); }

    .reset-link {
      font-size: 12px; color: var(--fg-muted); cursor: pointer;
      text-align: center; text-decoration: underline;
      padding: 8px; background: none; border: none; font-family: inherit;
      opacity: 0.55; width: 100%;
    }
    .reset-link:hover { opacity: 1; color: var(--danger); }

    /* ══════════════════ COMPLETION OVERLAY ══════════════════ */
    #completion-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: radial-gradient(ellipse 100% 80% at 50% 50%,
        #071e33 0%,
        #040e1c 45%,
        #02080f 100%
      );
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    /* visible blue bloom behind the seal */
    #completion-overlay::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -60%);
      width: 340px; height: 340px;
      border-radius: 50%;
      background: rgba(56,189,248,0.10);
      filter: blur(90px);
      pointer-events: none;
    }
    #completion-overlay.visible {
      opacity: 1; pointer-events: all;
    }
    #completion-canvas {
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .co-inner {
      position: relative; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
      gap: 20px; max-width: 380px; width: 100%;
      transform: scale(0.88) translateY(20px);
      transition: transform 0.45s cubic-bezier(0.34,1.56,0.64,1);
    }
    #completion-overlay.visible .co-inner {
      transform: scale(1) translateY(0);
    }
    .co-seal {
      width: 110px; height: 110px; border-radius: 50%;
      background: var(--accent-tint);
      border: 2px solid rgba(56,189,248,0.5);
      display: flex; align-items: center; justify-content: center;
      font-size: 52px;
      box-shadow: 0 0 0 8px rgba(56,189,248,0.08), 0 0 60px rgba(56,189,248,0.25);
      animation: pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 8px rgba(56,189,248,0.08), 0 0 40px rgba(56,189,248,0.2); }
      50%       { box-shadow: 0 0 0 14px rgba(56,189,248,0.12), 0 0 80px rgba(56,189,248,0.35); }
    }
    .co-eyebrow { color: var(--accent); letter-spacing: 0.2em; }
    .co-name {
      font-size: clamp(1.7rem, 7vw, 2.4rem);
      font-weight: 800; letter-spacing: -0.04em;
      color: var(--fg); line-height: 1.1;
    }
    .co-name em { color: var(--accent); font-style: normal; }
    .co-message {
      font-size: 15px; color: var(--fg-muted);
      line-height: 1.75; max-width: 320px;
    }
    .co-message strong { color: var(--fg); font-weight: 600; }
    .co-close {
      margin-top: 8px;
      width: 100%; max-width: 280px;
    }
  </style>
</head>
<body>

<!-- ═══════════════════ ONBOARDING ═══════════════════ -->
<section id="screen-onboard" class="screen active">
  <div class="onboard-box">
    <div class="onboard-header">
      <p class="eyebrow">⚡ Solo Missions</p>
      <h1 class="display">What's your name?</h1>
      <p class="sub">10 hard things. No gaps, no excuses. Your name goes on the record.</p>
    </div>
    <div class="onboard-row">
      <input class="input" id="name-input" type="text" placeholder="Your name" autocomplete="off" />
      <button class="btn btn-primary btn-lg" id="name-submit" disabled style="width:100%">Let's go →</button>
    </div>
  </div>
</section>

<!-- ═══════════════════ DASHBOARD ═══════════════════ -->
<section id="screen-dashboard" class="screen">
  <nav class="top-nav">
    <div class="nav-brand">
      <p class="eyebrow">⚡ Solo Missions</p>
      <p class="nav-name" id="nav-name"></p>
    </div>
    <div class="stat-pill"><em id="stat-done">0</em> / 10 done</div>
  </nav>
  <div class="dashboard-hero">
    <h1 class="display" id="hero-title">Your missions.</h1>
    <p>No gaps allowed. Miss a day — start over. That's the rule.</p>
  </div>
  <div class="missions-list" id="missions-list"></div>
</section>

<!-- ═══════════════════ DETAIL ═══════════════════ -->
<section id="screen-detail" class="screen">
  <nav class="detail-nav">
    <button class="btn btn-ghost btn-sm" id="back-btn">← Back</button>
    <p class="detail-nav-title" id="detail-nav-title"></p>
  </nav>
  <div class="detail-body" id="detail-body"></div>
</section>

<!-- ═══════════════════ COMPLETION OVERLAY ═══════════════════ -->
<div id="completion-overlay">
  <canvas id="completion-canvas"></canvas>
  <div class="co-inner">
    <div class="co-seal" id="co-seal"></div>
    <p class="eyebrow co-eyebrow">Mission Complete</p>
    <h2 class="co-name" id="co-name"></h2>
    <p class="co-message" id="co-message"></p>
    <button class="btn btn-primary btn-lg co-close" id="co-close">Back to missions →</button>
  </div>
</div>

<script>
// ── Mission definitions ────────────────────────────────────────────────────
const MISSIONS = [
  {
    id: 'walk', icon: '🥾',
    title: 'Walk 30–50KM Alone',
    sub: 'One long walk. No music, no distractions.',
    desc: 'No music, no podcasts, no distractions. Just you and your thoughts for an entire long-distance walk. Most people cannot handle their own mind that long. Prove you can.',
    type: 'oneshot', badge: 'One shot',
    win: (name) => `<strong>${name},</strong> you just walked 40km with nothing but your own mind for company. Most people can't handle 40 <em>minutes</em> of silence. You did it for miles. That's not a walk — that's a reckoning.`,
  },
  {
    id: 'sugar', icon: '🚫',
    title: '21 Days — Zero Sugar',
    sub: '21 days. No cheats, no "just this once".',
    desc: 'No sugar for 21 days — no cheat days, no exceptions. Watch how fast your brain starts begging. You are more addicted than you think. Cut the chemical. Own the craving.',
    type: 'daily', days: 21, badge: '21 days',
    win: (name) => `<strong>${name},</strong> 21 days clean. Your brain begged. It whined. It threw a full tantrum on Day 3. And you said <em>no</em> every single time. The craving didn't beat you — you beat it.`,
  },
  {
    id: 'silence', icon: '🔕',
    title: 'Train in Silence — 7 Days',
    sub: '7 days. No music, no hype. Just effort.',
    desc: 'Work out every day for 7 days with zero audio. No hype, no pump-up tracks. If you need noise to perform, you are weak. Learn to generate your own intensity.',
    type: 'daily', days: 7, badge: '7 days',
    win: (name) => `<strong>${name},</strong> 7 sessions. No music, no hype, no crutch. You learned what most athletes never figure out — the fire was <em>inside you</em> the entire time. The playlist was just noise.`,
  },
  {
    id: 'wakeup', icon: '⏰',
    title: 'Wake Up at 5AM — 30 Days',
    sub: '30 days. No snooze. No exceptions.',
    desc: 'Up at 5AM every day for 30 days. No snooze, no delay. Discipline is not built at night — it is built in the morning before the world wakes up.',
    type: 'daily', days: 30, badge: '30 days',
    win: (name) => `<strong>${name},</strong> 30 mornings at 5AM. That's 30 hours you took back while everyone else was still dreaming. You didn't find discipline — you <em>built</em> it, one alarm at a time.`,
  },
  {
    id: 'nosocial', icon: '📵',
    title: '7 Days — No Social Media',
    sub: '7 days. No likes, no scrolling, no validation.',
    desc: 'No social media for 7 days. No Instagram, X, TikTok, Reddit — nothing. Watch your brain panic when it has no feed to scroll. That panic is dependency. Face it.',
    type: 'daily', days: 7, badge: '7 days',
    win: (name) => `<strong>${name},</strong> 7 days offline. Nobody liked your posts. Nobody validated you. And you were completely fine. You were <em>never</em> dependent on it — you just believed you were. Now you know.`,
  },
  {
    id: 'shower', icon: '🧊',
    title: 'Cold Shower — 30 Days',
    sub: '30 days. No warm finish. Control your breath.',
    desc: 'Cold showers only for 30 days. No warm water to finish. The moment it hits you — control your breath. Control your breath, control your mind.',
    type: 'daily', days: 30, badge: '30 days',
    win: (name) => `<strong>${name},</strong> 30 days of cold water hitting you first thing every morning. Every instinct screamed "run" and you stood there anyway. <em>That's</em> what self-control actually feels like in the body.`,
  },
  {
    id: 'nophone', icon: '📴',
    title: '24 Hours — No Phone',
    sub: 'One full day. No notifications, no dopamine.',
    desc: 'Phone away for 24 straight hours. No notifications, no dopamine hits, no quick checks. The silence will feel deeply uncomfortable. That is how distracted you have become.',
    type: 'oneshot', badge: 'One shot',
    win: (name) => `<strong>${name},</strong> 24 hours with no phone. The world kept moving without your constant attention. The notifications survived without you. Turns out — <em>so did you.</em>`,
  },
  {
    id: 'book', icon: '📖',
    title: 'Read 1 Book in 1 Day',
    sub: 'Start and finish a full book in 24 hours.',
    desc: 'Read an entire book in a single day. No phones, no multi-tasking, no "I\'ll finish it later". Sit down, lock in, finish it. Prove your attention span still exists.',
    type: 'oneshot', badge: 'One shot',
    win: (name) => `<strong>${name},</strong> one book, one day, start to finish. The average person hasn't finished a single book this year. You just did it in a <em>day.</em> Your focus isn't broken — it was just untrained.`,
  },
  {
    id: 'alone', icon: '🚶',
    title: 'Go Out Alone — No Phone',
    sub: 'No safety net. Just presence.',
    desc: 'Go to a public place — café, park, restaurant — alone and without your phone. No safety net. Sit with yourself. Confidence is built in exactly these moments.',
    type: 'oneshot', badge: 'One shot',
    win: (name) => `<strong>${name},</strong> you walked into a room full of strangers with no phone, no distraction, no escape hatch — and you sat there. That discomfort you felt was <em>confidence being forged.</em>`,
  },
  {
    id: 'sleep', icon: '🌙',
    title: 'Sleep Before 10PM — 30 Days',
    sub: '30 nights. Lights out before 10. No screens.',
    desc: 'In bed, lights off, no screens — before 10PM every night for 30 days. Late nights are stolen mornings. Fix your sleep, fix your output. This is the foundation.',
    type: 'daily', days: 30, badge: '30 days',
    win: (name) => `<strong>${name},</strong> 30 nights of choosing tomorrow over tonight. Every single night. You gave your brain the recovery it was silently begging for. <em>This</em> is the foundation everything else sits on.`,
  },
]

// ── Storage helpers ────────────────────────────────────────────────────────
const KEY_USER = 'sm:user'
const pKey = id => `sm:p:${id}`

const getUser    = () => { try { return JSON.parse(localStorage.getItem(KEY_USER) || 'null') } catch { return null } }
const saveUser   = u  => localStorage.setItem(KEY_USER, JSON.stringify(u))
const getP       = id => { try { return JSON.parse(localStorage.getItem(pKey(id)) || 'null') } catch { return null } }
const saveP      = (id, d) => localStorage.setItem(pKey(id), JSON.stringify(d))

// Always use local calendar date — never .toISOString() which gives UTC and
// breaks for timezones ahead of UTC (e.g. IST +5:30 shows yesterday).
function localDateStr(d) {
  const dt = d || new Date()
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`
}
const todayStr = () => localDateStr()

function addDays(base, n) {
  const [y, m, d] = base.split('-').map(Number)
  const dt = new Date(y, m - 1, d + n)
  return localDateStr(dt)
}

// ── Daily progress helpers ─────────────────────────────────────────────────
function dailyP(id) {
  return getP(id) || { startDate: null, checkedDates: [] }
}

// Returns { streak, longest, checked, hasGap, todayDate, todayDayNum, totalDays, dayRows }
function analyzeDailyMission(m) {
  const p = dailyP(m.id)
  const today = todayStr()

  if (!p.startDate) {
    return { notStarted: true, p }
  }

  const checkedSet = new Set(p.checkedDates)
  const totalDays = m.days
  let hasGap = false
  let streak = 0
  let longest = 0
  let cur = 0
  const dayRows = []

  for (let i = 0; i < totalDays; i++) {
    const dStr  = addDays(p.startDate, i)
    const dayNum = i + 1
    const isChecked = checkedSet.has(dStr)
    const isFuture  = dStr > today
    const isToday   = dStr === today
    const isMissed  = !isChecked && !isFuture && dStr < today

    if (isMissed) hasGap = true

    // streak: consecutive checked from end up to today
    if (isChecked) { cur++; longest = Math.max(longest, cur) }
    else { cur = 0 }

    dayRows.push({ dStr, dayNum, isChecked, isFuture, isToday, isMissed })
  }

  // current streak from today backwards
  let s = 0
  for (let i = totalDays - 1; i >= 0; i--) {
    const row = dayRows[i]
    if (row.isFuture) continue
    if (row.isChecked) s++
    else break
  }
  streak = s

  const checked = p.checkedDates.length
  const done    = checked >= totalDays && !hasGap

  return { p, notStarted: false, hasGap, streak, longest, checked, done, dayRows, totalDays }
}

function isMissionDone(m) {
  if (m.type === 'oneshot') return (getP(m.id) || {}).completed === true
  const a = analyzeDailyMission(m)
  return a.done === true
}

function missionHasGap(m) {
  if (m.type === 'oneshot') return false
  const a = analyzeDailyMission(m)
  return !a.notStarted && a.hasGap
}

// ── Screen routing ─────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'))
  document.getElementById(id).classList.add('active')
  window.scrollTo({ top: 0 })
}

// ── Onboarding ─────────────────────────────────────────────────────────────
const nameInput  = document.getElementById('name-input')
const nameSubmit = document.getElementById('name-submit')

nameInput.addEventListener('input', () => {
  nameSubmit.disabled = !nameInput.value.trim()
})
nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && nameInput.value.trim()) finishOnboard()
})
nameSubmit.addEventListener('click', finishOnboard)

function finishOnboard() {
  const name = nameInput.value.trim()
  if (!name) return
  saveUser({ name })
  loadDashboard(name)
  showScreen('screen-dashboard')
}

// ── Dashboard ──────────────────────────────────────────────────────────────
function loadDashboard(name) {
  document.getElementById('nav-name').textContent = name
  document.getElementById('hero-title').textContent = `Your missions, ${name.split(' ')[0]}.`
  renderList()
}

function missionSortKey(m) {
  // 0 = gap (needs attention), 1 = active in-progress, 2 = not started, 3 = done
  if (isMissionDone(m)) return 3
  if (missionHasGap(m)) return 0
  if (m.type === 'daily') {
    const a = analyzeDailyMission(m)
    return a.notStarted ? 2 : 1
  }
  return 2
}

function renderList() {
  const list = document.getElementById('missions-list')
  const doneCount = MISSIONS.filter(m => isMissionDone(m)).length
  document.getElementById('stat-done').textContent = doneCount
  list.innerHTML = ''

  const sorted = [...MISSIONS].sort((a, b) => missionSortKey(a) - missionSortKey(b))

  sorted.forEach(m => {
    const done = isMissionDone(m)
    const gap  = missionHasGap(m)
    let pct    = 0

    if (m.type === 'daily') {
      const a = analyzeDailyMission(m)
      if (!a.notStarted) pct = Math.round((a.checked / m.days) * 100)
    } else {
      pct = done ? 100 : 0
    }

    const cls = done ? 'done' : gap ? 'gap' : ''
    const badgeText = done ? '✓ Done' : gap ? '⚠ Gap!' : m.badge

    const card = document.createElement('div')
    card.className = `card mission-card ${cls}`.trim()
    card.innerHTML = `
      <div class="m-icon">${m.icon}</div>
      <div class="m-body">
        <p class="m-title">${m.title}</p>
        <p class="m-sub">${m.sub}</p>
      </div>
      <div class="m-right">
        <span class="m-badge">${badgeText}</span>
        <div class="m-bar"><div class="m-bar-fill ${gap ? 'warn' : 'ok'}" style="width:${pct}%"></div></div>
      </div>
    `
    card.addEventListener('click', () => openDetail(m.id))
    list.appendChild(card)
  })
}

// ── Detail ─────────────────────────────────────────────────────────────────
let activeMission = null

document.getElementById('back-btn').addEventListener('click', () => {
  renderList()
  showScreen('screen-dashboard')
})

function openDetail(id) {
  activeMission = MISSIONS.find(m => m.id === id)
  document.getElementById('detail-nav-title').textContent = activeMission.title
  renderDetail()
  showScreen('screen-detail')
}

function renderDetail() {
  const m = activeMission
  const body = document.getElementById('detail-body')
  body.innerHTML = `
    <div>
      <div class="detail-icon">${m.icon}</div>
      <h1 class="detail-title">${m.title}</h1>
      <p class="detail-desc">${m.desc}</p>
    </div>
  `
  if (m.type === 'daily') renderDailySection(m, body)
  else                     renderOneshotSection(m, body)
}

function renderDailySection(m, body) {
  const a = analyzeDailyMission(m)

  // Gap banner — must reset
  if (!a.notStarted && a.hasGap) {
    const b = document.createElement('div')
    b.className = 'banner banner-gap'
    b.innerHTML = `
      <div class="banner-icon">⚠️</div>
      <div class="banner-text">
        <div class="title">You missed a day.</div>
        <div class="sub">No gaps allowed. You must reset and start over. That's the rule.</div>
      </div>
    `
    body.appendChild(b)

    const btn = document.createElement('button')
    btn.className = 'btn btn-danger btn-lg'
    btn.style.width = '100%'
    btn.textContent = 'Reset & Start Over'
    btn.addEventListener('click', () => {
      if (confirm(`Reset "${m.title}"? All ${a.checked} days of progress will be lost.`)) {
        saveP(m.id, { startDate: null, checkedDates: [] })
        renderDetail()
      }
    })
    body.appendChild(btn)
    return
  }

  // Done banner
  if (a.done) {
    const b = document.createElement('div')
    b.className = 'banner banner-done'
    b.innerHTML = `
      <div class="banner-icon">🔥</div>
      <div class="banner-text">
        <div class="title">Mission Complete</div>
        <div class="sub">All ${m.days} days. No gaps. Respect.</div>
      </div>
    `
    body.appendChild(b)
  }

  // Not started — show Start button
  if (a.notStarted) {
    const intro = document.createElement('div')
    intro.innerHTML = `
      <p class="section-label">Ready?</p>
      <p style="font-size:14px;color:var(--fg-muted);margin-bottom:16px">Day 1 starts today. No gaps allowed — if you miss a day you must reset.</p>
    `
    body.appendChild(intro)

    const btn = document.createElement('button')
    btn.className = 'btn btn-primary btn-lg'
    btn.style.width = '100%'
    btn.textContent = `Start ${m.title}`
    btn.addEventListener('click', () => {
      saveP(m.id, { startDate: todayStr(), checkedDates: [] })
      renderDetail()
    })
    body.appendChild(btn)
    return
  }

  // Streak stats
  const stats = document.createElement('div')
  stats.innerHTML = `
    <p class="section-label">Progress</p>
    <div class="streak-row">
      <div class="streak-box"><p class="streak-num">${a.streak}</p><p class="streak-lbl">Streak</p></div>
      <div class="streak-box"><p class="streak-num">${a.checked}</p><p class="streak-lbl">Done</p></div>
      <div class="streak-box"><p class="streak-num">${m.days - a.checked}</p><p class="streak-lbl">Left</p></div>
    </div>
  `
  body.appendChild(stats)

  // Day grid
  const gridWrap = document.createElement('div')
  gridWrap.innerHTML = `<p class="section-label">Daily check-in${a.done ? '' : ' — tap today to check in'}</p>`
  body.appendChild(gridWrap)

  const grid = document.createElement('div')
  grid.className = 'day-grid'

  a.dayRows.forEach(row => {
    const cell = document.createElement('div')
    let cls = 'day-cell'
    if (row.isChecked)                      cls += ' checked'
    else if (row.isMissed)                  cls += ' missed'
    else if (row.isToday && !a.done)        cls += ' today-unchecked'
    else if (row.isFuture)                  cls += ' future'

    cell.className = cls
    cell.innerHTML = `
      <span class="day-n">${row.dayNum}</span>
      <span class="day-tick">${row.isChecked ? '✓' : row.isMissed ? '✗' : row.isToday && !a.done ? '·' : ''}</span>
    `

    // Only today's cell is tappable (and only if not done)
    if (row.isToday && !row.isChecked && !a.done) {
      cell.addEventListener('click', () => {
        const p = dailyP(m.id)
        p.checkedDates.push(row.dStr)
        saveP(m.id, p)
        // Check if this was the final day
        const updated = analyzeDailyMission(m)
        if (updated.done) { showCompletion(m); return }
        renderDetail()
      })
    }
    // Allow unchecking today if already checked
    if (row.isToday && row.isChecked && !a.done) {
      cell.style.cursor = 'pointer'
      cell.title = 'Tap to uncheck today'
      cell.addEventListener('click', () => {
        const p = dailyP(m.id)
        p.checkedDates = p.checkedDates.filter(d => d !== row.dStr)
        saveP(m.id, p)
        renderDetail()
      })
    }

    grid.appendChild(cell)
  })
  body.appendChild(grid)

  // Reset link (only if in progress, not done)
  if (!a.done) {
    const rl = document.createElement('button')
    rl.className = 'reset-link'
    rl.textContent = 'Reset this mission'
    rl.addEventListener('click', () => {
      if (confirm(`Reset "${m.title}"? All progress will be lost.`)) {
        saveP(m.id, { startDate: null, checkedDates: [] })
        renderDetail()
      }
    })
    body.appendChild(rl)
  }
}

function renderOneshotSection(m, body) {
  const p  = getP(m.id) || { completed: false, completedAt: null }
  const done = p.completed

  const box = document.createElement('div')
  box.className = `oneshot-box${done ? ' done' : ''}`
  box.innerHTML = `
    <p class="oneshot-box-label">${done ? '🔥 Completed' : 'Not done yet'}</p>
    <p class="oneshot-box-sub">${done
      ? `Finished ${new Date(p.completedAt).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}`
      : 'Mark complete when you have actually done it. No lying to yourself.'
    }</p>
  `
  body.appendChild(box)

  if (!done) {
    const btn = document.createElement('button')
    btn.className = 'btn btn-primary btn-lg'
    btn.style.width = '100%'
    btn.textContent = 'Mark as Done ✓'
    btn.addEventListener('click', () => {
      saveP(m.id, { completed: true, completedAt: new Date().toISOString() })
      showCompletion(m)
    })
    body.appendChild(btn)
  }

}

// ── Completion celebration ─────────────────────────────────────────────────
const overlay    = document.getElementById('completion-overlay')
const coCanvas   = document.getElementById('completion-canvas')
const coSeal     = document.getElementById('co-seal')
const coName     = document.getElementById('co-name')
const coMessage  = document.getElementById('co-message')
const coClose    = document.getElementById('co-close')

let confettiRaf  = null
let confettiPcs  = []

const CONFETTI_COLORS = ['#38bdf8','#7dd3fc','#bae6fd','#ffffff','#e0f2fe','#0ea5e9','#93c5fd']

function launchConfetti() {
  const canvas = coCanvas
  canvas.width  = window.innerWidth
  canvas.height = window.innerHeight
  const ctx = canvas.getContext('2d')

  confettiPcs = Array.from({ length: 110 }, () => ({
    x: Math.random() * canvas.width,
    y: -10 - Math.random() * 80,
    w: 6 + Math.random() * 8,
    h: 3 + Math.random() * 5,
    color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
    vx: (Math.random() - 0.5) * 2.5,
    vy: 2.5 + Math.random() * 3.5,
    angle: Math.random() * Math.PI * 2,
    spin: (Math.random() - 0.5) * 0.18,
    opacity: 0.85 + Math.random() * 0.15,
  }))

  cancelAnimationFrame(confettiRaf)
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    let alive = false
    confettiPcs.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.angle += p.spin
      p.opacity -= 0.003
      if (p.y < canvas.height && p.opacity > 0) alive = true
      ctx.save()
      ctx.globalAlpha = Math.max(0, p.opacity)
      ctx.translate(p.x, p.y)
      ctx.rotate(p.angle)
      ctx.fillStyle = p.color
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h)
      ctx.restore()
    })
    if (alive) confettiRaf = requestAnimationFrame(tick)
    else ctx.clearRect(0, 0, canvas.width, canvas.height)
  }
  confettiRaf = requestAnimationFrame(tick)
}

function showCompletion(mission) {
  const user = getUser()
  const firstName = (user?.name || 'You').split(' ')[0]

  coSeal.textContent    = mission.icon
  coName.innerHTML      = `You did it.`
  coMessage.innerHTML   = mission.win(firstName)

  overlay.classList.add('visible')
  launchConfetti()
}

coClose.addEventListener('click', () => {
  overlay.classList.remove('visible')
  cancelAnimationFrame(confettiRaf)
  coCanvas.getContext('2d').clearRect(0, 0, coCanvas.width, coCanvas.height)
  renderList()
  showScreen('screen-dashboard')
})

// ── Boot ───────────────────────────────────────────────────────────────────
const user = getUser()
const qWin = new URLSearchParams(location.search).get('win')

if (qWin) {
  // ?win=<missionId>  →  preview the completion animation (dev/demo use)
  const previewMission = MISSIONS.find(m => m.id === qWin) || MISSIONS[0]
  if (!user) saveUser({ name: 'You' })
  loadDashboard((user?.name) || 'You')
  showScreen('screen-dashboard')
  // slight delay so the dashboard renders first, making the overlay dismissal feel right
  setTimeout(() => showCompletion(previewMission), 300)
} else if (user && user.name) {
  loadDashboard(user.name)
  showScreen('screen-dashboard')
} else {
  showScreen('screen-onboard')
  nameInput.focus()
}
</script>
